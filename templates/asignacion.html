<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscando Experto - Okupo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --color-crema: #fdfaf5;
            --color-texto: #5a3e2b;
            --color-dorado: #d4af37;
            --color-madera-oscura: #3d2b1f;
        }

        html, body {
            background-color: var(--color-crema);
            margin: 0; padding: 0; width: 100%; height: 100%;
        }

        body {
            background-image: url('/static/fondo_pared.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-texto);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        .logo-searching {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 50px;
            color: var(--color-texto);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        .radar-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 50px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--color-dorado);
            border-radius: 50%;
            opacity: 0;
            animation: pulse 3s infinite;
        }

        .radar-circle:nth-child(2) { animation-delay: 1s; }
        .radar-circle:nth-child(3) { animation-delay: 2s; }

        .stone-core {
            width: 100px;
            height: 100px;
            background-color: var(--color-dorado);
            border-radius: 50%;
            border: 4px solid var(--color-madera-oscura);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--color-madera-oscura);
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        h2 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--color-texto);
        }

        .searching-text {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.8;
            line-height: 1.6;
            margin: 0 auto 40px auto;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .btn-cancelar {
            display: inline-block;
            background-image: url('/static/madera_oscura.jpg');
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-searching">okupo</div>

        <div class="radar-container">
            <div class="radar-circle"></div>
            <div class="radar-circle"></div>
            <div class="radar-circle"></div>
            <div class="stone-core">
                <i class="fas fa-map-marker-alt"></i>
            </div>
        </div>

        <h2>Buscando Experto<span class="dots"></span></h2>
        <p class="searching-text">Estamos localizando al mejor profesional cerca de tu ubicación para atender tu solicitud.</p>

        <a href="{{ url_for('pedidos.mis_pedidos') }}" class="btn-cancelar">Cancelar Búsqueda</a>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "{{ url_for('pedidos.mis_pedidos') }}";
        }, 5000);
    </script>
</body>
</html>
