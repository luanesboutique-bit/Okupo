<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Direcciones - Okupo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-crema: #fdfaf5;
            --color-texto: #5a3e2b;
            --color-dorado: #d4af37;
        }
        body {
            background-image: url('/static/fondo_pared.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-texto);
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }
        .app-container { width: 100%; max-width: 450px; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .header a { color: var(--color-texto); font-size: 24px; }
        .header h1 { flex: 1; font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; text-align: center; }
        
        .card-direccion {
            background: rgba(253, 250, 245, 0.95);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(139, 90, 43, 0.1);
            display: flex; align-items: flex-start; gap: 15px;
        }
        .icon-dir { font-size: 20px; color: var(--color-dorado); margin-top: 5px; }
        .btn-agregar {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px dashed var(--color-dorado);
            background: transparent; color: var(--color-dorado); font-weight: 900;
            text-align: center; cursor: pointer; text-decoration: none; display: block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="{{ url_for('principal.index') }}"><i class="fas fa-arrow-left"></i></a>
            <h1>Mis Direcciones</h1>
        </div>
        
        {% for dir in direcciones %}
        <div class="card-direccion">
            <i class="fas fa-map-marker-alt icon-dir"></i>
            <div style="flex: 1;">
                <div style="font-weight: 900;">{{ dir.alias or 'Dirección' }}</div>
                <div style="font-size: 13px; opacity: 0.8;">{{ dir.calle }} {{ dir.numero }}, {{ dir.colonia }}</div>
            </div>
            <i class="fas fa-trash-alt" style="opacity: 0.3; cursor: pointer;"></i>
        </div>
        {% else %}
        <div style="text-align: center; margin-top: 50px; opacity: 0.7;">
            <p>No tienes direcciones guardadas.</p>
        </div>
        {% endfor %}
        
        <a href="{{ url_for('principal.agregar_direccion') }}" class="btn-agregar"><i class="fas fa-plus"></i> AGREGAR NUEVA DIRECCIÓN</a>
    </div>
</body>
</html>
