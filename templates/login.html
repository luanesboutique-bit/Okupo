<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Okupo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --color-crema: #fdfaf5;
            --color-texto: #5a3e2b;
            --color-dorado: #d4af37;
            --color-madera-oscura: #3d2b1f;
        }

        body {
            background-image: url('/static/fondo_pared.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-texto);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(253, 250, 245, 0.95);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid rgba(139, 90, 43, 0.1);
        }

        .logo-main {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 5px;
            color: var(--color-madera-oscura);
            text-transform: uppercase;
        }

        .slogan {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 40px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-social {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 1px solid rgba(139, 90, 43, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            background: white;
            cursor: pointer;
            color: var(--color-texto);
        }

        .btn-google { color: #ea4335; }
        .btn-facebook { color: #1877f2; }
        .btn-email { 
            background-image: url('/static/madera_oscura.jpg');
            color: white;
            border: none;
            text-shadow: 0 1px 2px black;
        }

        .login-form {
            display: none;
            text-align: left;
            margin-top: 20px;
        }
        .login-form.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(139, 90, 43, 0.2); box-sizing: border-box; background: var(--color-crema); }

        .professional-link {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 90, 43, 0.1);
        }
        .professional-link a { color: var(--color-dorado); font-weight: 900; }
    </style>
</head>
<body>

    <div class="app-container">
        <div style="margin-bottom: 25px;">
            <img src="/static/logo_okupo_naranja.svg" style="width: 100%; max-width: 250px; height: auto;">
        </div>

        {% if error %}
            <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 12px; font-weight: 700;">
                {{ error }}
            </div>
        {% endif %}

        <div id="social-view">
            <div class="social-buttons">
                <!-- Google Sign-In Button -->
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
                <div class="g_id_signin btn-social btn-google" data-type="standard" data-shape="pill">
                    <i class="fab fa-google"></i> Entrar con Google
                </div>

                <button id="btn-facebook" class="btn-social btn-facebook">
                    <i class="fab fa-facebook-f"></i> Entrar con Facebook
                </button>
                <button onclick="showEmailLogin()" class="btn-social btn-email">
                    <i class="fas fa-envelope"></i> Entrar con Correo
                </button>
            </div>
        </div>

        <div id="email-view" class="login-form">
            <form action="/login" method="POST">
                {% if proximo %} <input type="hidden" name="proximo" value="{{ proximo }}"> {% endif %}
                <div class="input-group">
                    <label>Correo o Teléfono</label>
                    <input type="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" name="contrasenna" required>
                </div>
                <button type="submit" class="btn-social btn-email" style="width: 100%;">Ingresar</button>
                <a href="javascript:void(0)" onclick="hideEmailLogin()" style="display: block; margin-top: 15px; font-size: 12px; color: var(--color-texto);">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </form>
        </div>

        <div class="professional-link">
            <p style="font-size: 12px; opacity: 0.7;">¿Eres un experto del hogar?</p>
            <a href="{{ url_for('autenticacion.registro', rol='colaborador') }}">Regístrate como Técnico</a>
        </div>
    </div>

    <script>
        // Inicialización del SDK de Facebook
        window.fbAsyncInit = function() {
            FB.init({ appId: 'YOUR_FACEBOOK_APP_ID', cookie: true, xfbml: true, version: 'v18.0' });
        };
        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/es_LA/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));

        document.getElementById('btn-facebook').addEventListener('click', function(e) {
            e.preventDefault();
            FB.login(function(response) {
                if (response.authResponse) loginSocial('facebook', response.authResponse.accessToken);
            }, {scope: 'public_profile,email'});
        });

        async function loginSocial(red_social, token) {
            const res = await fetch(`/login/social/${red_social}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token })
            });
            const data = await res.json();
            if (data.status === 'success') window.location.href = data.redirect;
            else alert('Error: ' + data.message);
        }

        function handleGoogleLogin(response) { loginSocial('google', response.credential); }
        function showEmailLogin() {
            document.getElementById('social-view').style.display = 'none';
            document.getElementById('email-view').classList.add('active');
        }
        function hideEmailLogin() {
            document.getElementById('social-view').style.display = 'block';
            document.getElementById('email-view').classList.remove('active');
        }
    </script>
</body>
</html>
