<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Okupo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --color-crema: #fdfaf5; --color-texto: #5a3e2b; --color-dorado: #d4af37; }
        body {
            background-image: url('/static/fondo_pared.jpg');
            background-size: cover; background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif; color: var(--color-texto);
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }
        .app-container { width: 100%; max-width: 450px; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .header a { color: var(--color-texto); font-size: 24px; }
        .header h1 { flex: 1; font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; text-align: center; }
        
        .card-perfil {
            background: rgba(253, 250, 245, 0.95);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(139, 90, 43, 0.1);
            text-align: center;
        }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--color-dorado); margin-bottom: 15px; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .btn-accion {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: var(--color-dorado); color: white; font-weight: 900;
            text-align: center; cursor: pointer; text-decoration: none; display: block; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="{{ url_for('principal.index') }}"><i class="fas fa-arrow-left"></i></a>
            <h1>Mi Perfil</h1>
        </div>
        
        <div class="card-perfil">
            <img src="{{ usuario.foto_url or '/static/avatar_default.png' }}" class="avatar">
            <h2>{{ usuario.nombre or 'Usuario' }}</h2>
            <div class="info-row"><span>Correo:</span> <b>{{ usuario.correo or 'No disponible' }}</b></div>
            <div class="info-row"><span>Teléfono:</span> <b>{{ usuario.telefono or 'No registrado' }}</b></div>
            <div class="info-row"><span>Rol:</span> <b>{{ usuario.rol | capitalize }}</b></div>
            
            <button class="btn-accion">EDITAR INFORMACIÓN</button>
        </div>
    </div>
</body>
</html>
