<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Técnico - Datos Personales - Okupo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --color-crema: #fdfaf5;
            --color-texto: #5a3e2b;
            --color-dorado: #d4af37;
        }

        /* 🛠️ FUERZA EL FONDO DE PARED Y ELIMINA CUALQUIER NEGRO */
        html, body {
            background-color: var(--color-crema) !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-image: url('/static/fondo_pared.jpg') !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            background-position: center !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .registro-container {
            width: 90%;
            max-width: 450px;
            background: var(--color-crema) !important;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png') !important;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid rgba(139, 90, 43, 0.3);
            position: relative;
            z-index: 10;
        }

        /* Paso del Registro */
        .step-indicator {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background-image: url('/static/madera_media.jpg');
            background-size: cover;
            color: var(--color-texto);
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }

        h2 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 10px 0;
            text-align: center;
            color: var(--color-texto) !important;
        }

        p.sub-guia {
            text-align: center; font-size: 14px; margin-bottom: 30px; color: #000000 !important; font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-texto);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--color-dorado);
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 15px;
            border: 1px solid #d4c5b3;
            background: rgba(255,255,255,0.7);
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s;
            color: var(--color-texto);
        }

        .input-wrapper input:focus {
            border-color: var(--color-texto);
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.1);
        }

        .btn-continuar {
            width: 100%;
            padding: 18px;
            background-image: url('/static/madera_oscura.jpg');
            background-size: cover;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-top: 10px;
            text-transform: uppercase;
            transition: transform 0.2s;
        }
        .btn-continuar:active { transform: scale(0.98); }

        .footer-info {
            margin-top: 25px;
            font-size: 11px;
            text-align: center;
            opacity: 0.6;
            line-height: 1.4;
            color: var(--color-texto);
        }

        #map-container {
            height: 150px;
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--color-dorado);
            display: none;
            overflow: hidden;
        }

    </style>
</head>
<body>

    <div class="registro-container">
        <div class="step-indicator">Paso 1 de 5</div>
        
        <h2>Datos Personales</h2>
        <p class="sub-guia">Completa tu perfil para que podamos verificarte.</p>

        {% if error %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid #f5c6cb;">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('colaboradores.registro_tecnico_datos') }}" method="POST" id="registro-form">
            <!-- Nombre y Correo omitidos por ser redundantes según el plan de refacción -->
            
            <div class="input-group">
                <label>Teléfono de Contacto</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone-alt"></i>
                    <input type="tel" name="telefono_verificacion" placeholder="10 dígitos" required>
                </div>
            </div>

            <div class="input-group">
                <label>Zona de Trabajo (Ubicación Geocodificada)</label>
                <div class="input-wrapper">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="zona_trabajo" name="zona_trabajo" placeholder="Busca tu ciudad o municipio..." required>
                    <button type="button" onclick="buscarUbicacion()" style="position: absolute; right: 5px; background: var(--color-dorado); border: none; color: white; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: bold;">
                        <i class="fas fa-search" style="position: static; color: white; font-size: 14px;"></i>
                    </button>
                </div>
            </div>

            <div id="map-container"></div>
            <input type="hidden" name="latitud" id="latitud">
            <input type="hidden" name="longitud" id="longitud">

            <div class="input-group">
                <label>Especialidad Resumen</label>
                <div class="input-wrapper">
                    <i class="fas fa-tools"></i>
                    <input type="text" name="especialidad_resumen" placeholder="Ej: Experto en Cerraduras Digitales" required>
                </div>
            </div>

            <div class="input-group">
                <label>Medio de Transporte</label>
                <div class="input-wrapper">
                    <i class="fas fa-motorcycle"></i>
                    <input type="text" name="medio_transporte" placeholder="Ej: Motocicleta, Auto, Transporte Público" required>
                </div>
            </div>

            <div class="input-group">
                <label>Sitio Web / Red Social (Opcional)</label>
                <div class="input-wrapper">
                    <i class="fas fa-globe"></i>
                    <input type="text" name="sitio_web" placeholder="https://tuportafolio.com">
                </div>
            </div>

            <button type="submit" class="btn-continuar">Siguiente Paso</button>
        </form>

        <div class="footer-info">
            Tus datos están protegidos por nuestras políticas de seguridad. Al continuar, aceptas los términos de servicio.
        </div>
    </div>

    <script>
        let map;
        let marker;

        function initMap(lat, lon) {
            const container = document.getElementById('map-container');
            container.style.display = 'block';

            if (!map) {
                map = L.map('map-container').setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                marker = L.marker([lat, lon]).addTo(map);
            } else {
                map.setView([lat, lon], 13);
                marker.setLatLng([lat, lon]);
            }
        }

        async function buscarUbicacion() {
            const query = document.getElementById('zona_trabajo').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    document.getElementById('latitud').value = lat;
                    document.getElementById('longitud').value = lon;
                    document.getElementById('zona_trabajo').value = data[0].display_name;
                    
                    initMap(lat, lon);
                } else {
                    alert("No se encontró la ubicación. Intenta ser más específico.");
                }
            } catch (error) {
                console.error("Error en geocoding:", error);
                alert("Error al buscar la ubicación.");
            }
        }

        // Permitir buscar al presionar Enter en el campo de zona_trabajo
        document.getElementById('zona_trabajo').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarUbicacion();
            }
        });
    </script>

</body>
</html>
