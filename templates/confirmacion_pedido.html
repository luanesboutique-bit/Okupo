<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Okupo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fdfaf5; font-family: 'Segoe UI', sans-serif; color: #5a3e2b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { width: 100%; max-width: 450px; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 30px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-inicio { background: url('/static/madera_oscura.jpg'); color: #ffff00; padding: 15px 30px; border-radius: 20px; text-decoration: none; font-weight: 900; display: inline-block; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="card">
            <i class="fas fa-check-circle" style="font-size: 50px; color: #27ae60; margin-bottom: 20px;"></i>
            <h2>¡Pedido Generado!</h2>
            <p>Tu solicitud de materiales ha sido enviada correctamente al técnico. Recibirás una actualización pronto.</p>
            <a href="/" class="btn-inicio">VOLVER AL INICIO</a>
        </div>
    </div>
</body>
</html>
